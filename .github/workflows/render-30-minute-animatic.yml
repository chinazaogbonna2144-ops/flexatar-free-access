name: Render Free 30-Minute Animatic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Render the 30-minute illustrated animatic
        run: |
          cd video-generator
          python render_30min_animatic.py
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 the-girl-who-heard-her-dead-mother-30min-animatic.mp4
      - name: Upload MP4 and chapter list
        uses: actions/upload-artifact@v4
        with:
          name: girl-who-heard-her-dead-mother-30min-animatic
          path: |
            video-generator/the-girl-who-heard-her-dead-mother-30min-animatic.mp4
            video-generator/scene-list.txt
          if-no-files-found: error
          retention-days: 30
